<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Деньги не пахнут</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050706; --bg2:#0c1210; --gold:#b8903a; --gold2:#d9b45e; --ink:#e8e2cf;
  --green:#1f8a4d; --green2:#0d4026; --blood:#6e1414;
  box-sizing:border-box; color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; color:var(--ink); overflow-x:hidden;
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(110,20,20,.28), transparent 55%),
    radial-gradient(ellipse at 50% 100%, rgba(40,70,60,.35), transparent 50%),
    linear-gradient(180deg,var(--bg2),var(--bg));
  background-attachment:fixed;
}
/* грязные мокрые купюры на фоне */
.bg{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0}
.note{
  position:absolute; width:170px; height:78px; border-radius:6px; opacity:.2; filter:blur(1.5px) saturate(.6);
  background:
    radial-gradient(circle at 50% 50%, rgba(0,0,0,.35) 0 22px, transparent 23px),
    linear-gradient(135deg,#3e4a33,#232c1f 60%,#171d15);
  border:3px solid rgba(120,110,70,.5);
  box-shadow:inset 0 0 18px rgba(0,0,0,.8);
  display:grid; place-items:center; font:900 26px "Unbounded",sans-serif; color:rgba(190,170,110,.55);
}
.note.a{left:-30px; top:12%; transform:rotate(-24deg)}
.note.b{right:-40px; top:30%; transform:rotate(18deg)}
.note.c{left:8%; top:58%; transform:rotate(9deg); opacity:.14}
.note.d{right:2%; top:78%; transform:rotate(-31deg)}
.note.e{left:-50px; top:86%; transform:rotate(-8deg); opacity:.16}
/* дождь */
.rain,.banner .rain{
  position:absolute; inset:-20% 0 0 0; pointer-events:none;
  background:
    repeating-linear-gradient(104deg, transparent 0 14px, rgba(170,200,210,.16) 14px 15px, transparent 15px 31px),
    repeating-linear-gradient(104deg, transparent 0 23px, rgba(170,200,210,.10) 23px 24px, transparent 24px 52px);
  background-size:100% 100%,100% 100%;
  animation:fall .55s linear infinite;
}
.rain{position:fixed; inset:0; z-index:1; opacity:.9}
@keyframes fall{from{background-position:0 0,0 0}to{background-position:-18px 120px,-30px 180px}}
.fog{position:fixed; inset:0; pointer-events:none; z-index:1;
  background:radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.85) 100%)}

.wrap{position:relative; z-index:2; max-width:520px; margin:0 auto; padding:18px 18px 40px}

/* БАННЕР */
.banner{
  position:relative; overflow:hidden; border-radius:32px; text-align:center; isolation:isolate;
  padding:20px 16px 26px;
  background:
    radial-gradient(ellipse at 50% 35%, rgba(150,30,30,.38), transparent 62%),
    linear-gradient(170deg,#101916,#040605 75%);
  box-shadow:0 0 0 2px rgba(184,144,58,.55), 0 24px 60px rgba(0,0,0,.8), 0 0 50px rgba(110,20,20,.35);
}
.banner .rain{z-index:3; opacity:.75}
.banner svg.scene{display:block; width:100%; height:auto; position:relative; z-index:1}
.banner h1{
  position:relative; z-index:2; margin:6px 0 0; font-family:"Unbounded","Manrope",sans-serif; font-weight:900;
  font-size:clamp(26px,8vw,40px); line-height:1.08;
  background:linear-gradient(180deg,#f0d98f,var(--gold) 55%,#6a4e14);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 3px 0 rgba(90,10,10,.9)) drop-shadow(0 8px 14px rgba(0,0,0,.9));
}
.banner p{position:relative; z-index:2; margin:10px auto 0; max-width:30ch; font-weight:700; font-size:15px; color:#bdb59a}

/* КНОПКИ */
.links{display:flex; flex-direction:column; gap:14px; margin-top:22px}
.btn{
  position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; gap:12px; width:100%;
  text-decoration:none; color:#fff; font-weight:800; border-radius:999px;
  transition:transform .15s ease, filter .15s ease; -webkit-tap-highlight-color:transparent;
}
.btn:hover{transform:translateY(-2px); filter:brightness(1.15)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--gold2); outline-offset:3px}
.tg{
  min-height:84px; font-size:22px;
  background:linear-gradient(135deg,#2a8fc4,#17608f 50%,#0b3552);
  border:2px solid rgba(140,210,255,.3);
  box-shadow:0 14px 34px rgba(0,0,0,.7), 0 0 30px rgba(39,167,231,.25), inset 0 1px 0 rgba(255,255,255,.25);

.tg::after{content:""; position:absolute; top:0; bottom:0; width:60px; left:-80px;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);
  transform:skewX(-20deg); animation:shine 4s ease-in-out infinite}
@keyframes shine{0%,55%{left:-80px}100%{left:120%}}
.tg svg{width:40px;height:40px;flex:none}
.tg small{display:block; font-size:13px; font-weight:700; opacity:.85; margin-top:2px}
.tg .t{text-align:left; line-height:1.1}
.divider{display:flex; align-items:center; gap:12px; margin:12px 0 2px; color:var(--gold2); font-weight:800; font-size:15px}

.divider::after{transform:scaleX(-1)}
.game{

.game .dot{width:10px;height:10px;border-radius:50%;background:#3df08a;box-shadow:0 0 10px #3df08a}
.rainc{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.stage{position:relative;margin:-20px -16px 0}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:linear-gradient(transparent,#060a08);z-index:3;pointer-events:none}
.sky{position:absolute;inset:0;width:100%;height:100%;z-index:0}

.neon{animation:neon 6s infinite}

@media (prefers-reduced-motion:reduce){.tg::after,.neon{animation:none}.btn{transition:none}}
</style>

<script>
(function(){
var RM=matchMedia('(prefers-reduced-motion: reduce)').matches,NS='http://www.w3.org/2000/svg';
/* огни в окнах */
document.querySelectorAll('.sky .bld').forEach(function(b){
  var x=+b.getAttribute('x'),y=+b.getAttribute('y'),w=+b.getAttribute('width'),h=+b.getAttribute('height'),p=b.classList.contains('far')?.17:.11,last=b;
  for(var wx=x+4;wx<x+w-5;wx+=7)for(var wy=y+6;wy<y+h-4;wy+=9)if(Math.random()<p){
    var r=document.createElementNS(NS,'rect');r.setAttribute('x',wx);r.setAttribute('y',wy);r.setAttribute('width',3.4);r.setAttribute('height',4.6);
    r.setAttribute('fill',Math.random()<.85?'#e9b44c':'#9fd4c8');r.setAttribute('opacity',(.5+Math.random()*.45).toFixed(2));
    last.after(r);last=r;}
});
/* дождь: время-зависимая анимация без рывков */
function Rain(cv,o){
  var c=cv.getContext('2d'),W=0,H=0,d=[],s=[],gT=0,last=0;
  function mk(init){var z=Math.random();return{x:Math.random()*(W+160)-80,y:init?Math.random()*H:-30-Math.random()*H*.3,z:z,l:9+z*20,v:420+z*620,a:.07+z*.28,w:.5+z*.9,
    ly:o.ground?gT+(H-gT)*(.08+.84*z):H+40};}
  function size(){var r=cv.getBoundingClientRect(),q=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;if(!W||!H)return;
    cv.width=W*q;cv.height=H*q;c.setTransform(q,0,0,q,0,0);gT=o.ground?H*o.ground:H;d=[];s=[];
    for(var i=0,n=Math.round(W*H/o.dens);i<n;i++)d.push(mk(true));}
  function step(t){
    var dt=Math.min((t-last)/1000||0,.04);last=t;var wind=o.wind+Math.sin(t/3500)*.03;
    c.clearRect(0,0,W,H);c.lineCap='round';
    for(var i=0;i<d.length;i++){var p=d[i];p.y+=p.v*dt;p.x+=p.v*dt*wind;
      if(p.y>=p.ly){if(o.ground&&p.z>.25)s.push({x:p.x,y:p.ly,z:p.z,a:0});d[i]=mk(false);continue;}
      c.strokeStyle='rgba(185,210,222,'+p.a+')';c.lineWidth=p.w;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.l*wind,p.y-p.l);c.stroke();}
    for(var j=s.length-1;j>=0;j--){var q=s[j];q.a+=dt/.45;if(q.a>=1){s.splice(j,1);continue;}
      var rr=2+q.z*9*q.a;c.strokeStyle='rgba(190,215,225,'+(.4*(1-q.a)*(.4+q.z))+')';c.lineWidth=.8;c.beginPath();c.ellipse(q.x,q.y,rr,rr*.3,0,0,6.283);c.stroke();}
    if(!RM)requestAnimationFrame(step);}
  size();new ResizeObserver(function(){size();if(RM)step(0);}).observe(cv);
  if(RM)step(0);else requestAnimationFrame(step);
}
Rain(document.getElementById('rainBg'),{dens:2600,wind:.16,ground:0});
Rain(document.getElementById('rainBn'),{dens:850,wind:.14,ground:168/190});
/* одна вспышка молнии раз в 9–16 секунд */
var f=document.querySelector('.flash');
function boom(){f.style.transition='none';f.style.opacity=.9;
  setTimeout(function(){f.style.transition='opacity .12s';f.style.opacity=.12},70);
  setTimeout(function(){f.style.transition='opacity .1s';f.style.opacity=.7},170);
  setTimeout(function(){f.style.transition='opacity .9s ease-out';f.style.opacity=0},260);
  setTimeout(boom,9000+Math.random()*7000);}
if(!RM)setTimeout(boom,3500);
})();
</script>
